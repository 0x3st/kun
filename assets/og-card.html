<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1200, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>坤坤 12:00</title>
  <style>
    * { box-sizing: border-box; }

    html,
    body {
      width: 1200px;
      height: 630px;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #2d2d2d;
      font-family: "Avenir Next", "Helvetica Neue", "PingFang SC", sans-serif;
    }

    .card {
      width: 100%;
      height: 100%;
      padding: 42px 58px 38px;
      position: relative;
      border-top: 8px solid #c89523;
      background:
        linear-gradient(to bottom, transparent 0 505px, #2d2d2d 505px 100%);
    }

    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
    }

    .identity {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .meme {
      width: 92px;
      height: 92px;
      display: block;
      object-fit: cover;
      box-shadow: 5px 5px 0 rgba(200, 149, 35, .28);
    }

    .name strong {
      display: block;
      font-size: 29px;
      letter-spacing: -.04em;
    }

    .name span {
      display: block;
      margin-top: 4px;
      color: #767671;
      font-size: 14px;
      letter-spacing: .06em;
    }

    .marks {
      display: flex;
      align-items: center;
      gap: 18px;
      padding-top: 8px;
      color: #c89523;
      font-size: 25px;
      font-weight: 800;
    }

    .ball {
      width: 38px;
      height: 38px;
      border: 3px solid #2d2d2d;
      border-radius: 50%;
      background: #d9682f;
      position: relative;
      overflow: hidden;
    }

    .ball::before,
    .ball::after {
      content: "";
      position: absolute;
      background: #2d2d2d;
    }

    .ball::before {
      width: 3px;
      height: 130%;
      left: 16px;
      top: -5px;
      transform: rotate(38deg);
    }

    .ball::after {
      width: 130%;
      height: 3px;
      left: -5px;
      top: 16px;
      transform: rotate(-30deg);
    }

    .clock {
      margin-top: 40px;
      font-size: 190px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.09em;
      line-height: .82;
      white-space: nowrap;
    }

    .clock span {
      color: #c89523;
    }

    .caption {
      margin-top: 28px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
    }

    .caption strong {
      font-size: 31px;
      letter-spacing: -.04em;
    }

    .caption span {
      color: #686864;
      font-size: 15px;
    }

    .footer {
      position: absolute;
      left: 58px;
      right: 58px;
      bottom: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #fff;
    }

    .footer strong {
      color: #e2b956;
      font-size: 18px;
      letter-spacing: .08em;
    }

    .footer span {
      color: #c5c5c1;
      font-size: 13px;
      letter-spacing: .05em;
    }
  </style>
</head>
<body>
  <main class="card">
    <header class="header">
      <div class="identity">
        <img class="meme" src="kun-memes/v2-8e8e6a43e36bc2f6fb41acaeaa631e7f_1440w.jpg" alt="" />
        <div class="name">
          <strong>你的坤历正在准确运行！</strong>
          <span>固定以北京时间（UTC+8）换算</span>
        </div>
      </div>
      <div class="marks" aria-hidden="true">
        <span>2.5</span>
        <i class="ball"></i>
      </div>
    </header>

    <div class="clock">12<span>:</span>00<span>:</span>00</div>

    <div class="caption">
      <strong>坤坤时间</strong>
      <span>1 坤秒 = 2.5 普通秒 · 1 坤日 = 60 普通小时</span>
    </div>

    <footer class="footer">
      <strong>KUN KUN CHRONOGRAPH</strong>
      <span>kun.py.kg</span>
    </footer>
  </main>
</body>
</html>
